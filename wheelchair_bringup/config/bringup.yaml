# Shared default parameters for the full stack (requirement 9.2.1).
# Values that differ between machines go in a separate override file (9.2.2);
# interface, tx_enabled and limits_profile are set from launch arguments.

/rnet_bridge:
  ros__parameters:
    pm_nibble: 0              # power module device nibble, measured on the chair
    joystick_nibble: 2       # joystick module device nibble, measured on the chair
    current_scale: 1.0       # amps per raw count; TBD against a clamp meter (6.4.4)
    pm_heartbeat_timeout: 2.5
    rx_silent_timeout: 1.0
    status_rate_hz: 10.0
    max_pct: 20              # joystick percent cap (6.3.6)
    cmd_stale_timeout: 0.1   # stop replying if /cmd_vel/safe is older than this (6.3.4)
    override_rearm_time: 0.5 # re-arm delay after the chair joystick is centred (6.3.8.2)

/wheelchair_safety:
  ros__parameters:
    cmd_timeout: 0.2
    heartbeat_timeout: 2.5
    current_limit: -1.0      # < 0 disables the over-current check until measured (5.3.2)
    current_time: 2.0
    status_timeout: 1.0
    battery_warn_pct: 20.0
    battery_limit_pct: 10.0
    battery_speed_scale: 0.25
    max_linear: 0.5
    max_angular: 1.0
    output_rate_hz: 50.0
    state_rate_hz: 10.0

/joy_node:
  ros__parameters:
    # Match the controller by name, not by index. A joystick's index depends on how many
    # other input devices are attached and in what order, so it changes between machines
    # and between boots; the name does not. joy_node retries while the named device is
    # absent and opens it when it appears, which is what the Pi needs when it boots before
    # the controller is switched on. device_id is only a fallback for an unnamed device.
    #
    # This is the name SDL reports, which joy_node matches against, and it is NOT the
    # kernel's name for the same pad: /sys/class/input/js*/device/name says
    # 'Microsoft Xbox Controller'. Take the string from
    # `ros2 run joy joy_enumerate_devices`, not from /sys or /proc/bus/input/devices.
    device_name: 'Xbox One Controller'
    device_id: 0
    autorepeat_rate: 25.0    # must stay above teleop's output_rate_hz (2.1.3)
    deadzone: 0.0            # teleop owns the deadzone; its own default is 0.05 (2.2.3)

/wheelchair_input:
  ros__parameters:
    profile: xbox_one        # device profile name under wheelchair_input/config (2.1.2)
    profile_path: ''         # absolute path to a profile outside the package; overrides above
    enabled: true            # set false at runtime to mute this device
    joy_timeout: 0.5         # warn-only; teleop's input_timeout is what stops the chair

/wheelchair_teleop:
  ros__parameters:
    # 0.15, not the 0.1 default of 2.2.3: the Xbox pad's left stick was measured resting
    # between +0.01 and -0.11, so at 0.1 a centred stick commanded -0.004 rad/s of
    # rotation while the deadman was held. The offset wanders, so widening the deadzone
    # is more robust here than a fixed `trim` in the device profile.
    deadzone: 0.15
    max_linear: 0.5
    max_angular: 1.0
    input_timeout: 0.5       # stop publishing if /operator/input goes stale (2.1.3)
    speed_scales: [0.25, 0.5, 1.0]
    output_rate_hz: 20.0
    sources: ['']            # device 'source' names to accept; [''] accepts any
    request_manual_mode: true

/wheelchair_control:
  ros__parameters:
    source_timeout: 0.25
    output_rate_hz: 20.0
    default_mode: idle        # blocks all sources until Mode Manager reports otherwise
    mode_timeout: 2.0

/wheelchair_mode:
  ros__parameters:
    auto_enabled: false       # Auto stays unavailable until 1.1.3 is lifted (3.2.6)
    state_rate_hz: 1.0

/wheelchair_test_sequences:
  ros__parameters:
    sequence: forward_back
    speed: 0.1
    ramp: 1.0
    hold: 3.0
    pause: 1.0
    output_rate_hz: 20.0
    return_to_idle: true
